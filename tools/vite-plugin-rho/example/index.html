<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rho in vite</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem 1.25rem;
      }
      h1 { font-size: 1.4rem; }
      p.lead { color: #667; margin-top: -0.5rem; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      td, th {
        text-align: left;
        padding: 0.45rem 0.6rem;
        border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        font-size: 0.95rem;
      }
      td.expr { font-family: ui-monospace, "SF Mono", Menlo, monospace; opacity: 0.75; }
      td.result { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
      footer { margin-top: 2rem; font-size: 0.8rem; opacity: 0.6; }
    </style>
  </head>
  <body>
    <h1>rho, in a Vite project</h1>
    <p class="lead">
      These values are computed by real rho functions, compiled to WebAssembly
      at build time and imported like any TypeScript module.
    </p>
    <table id="results">
      <thead>
        <tr><th>expression</th><th>result</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <footer>
      Generated by <code>vite-plugin-rho</code> — the wasm asset and the typed
      companion module are produced from <code>src/index.rho</code>.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
