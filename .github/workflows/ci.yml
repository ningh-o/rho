name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build boot compiler
        run: make -j
      - name: selftest (ast goldens, diagnostics)
        run: make test

  wasm:
    # boot ships one target: wasm32-wasi — the corpus is its referee.
    # (the native images are built and graded by the self-hosted compiler;
    # boot cannot emit them, so the old linux/mac image jobs are gone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build boot compiler
        run: make -j
      - name: install wasmtime (the wasm32-wasi run/test vehicle)
        run: |
          curl -sSfL -o /tmp/wt.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v27.0.0/wasmtime-v27.0.0-x86_64-linux.tar.xz
          tar -xJf /tmp/wt.tar.xz -C /tmp
          echo "/tmp/wasmtime-v27.0.0-x86_64-linux" >> "$GITHUB_PATH"
      - name: corpus wasm32-wasi
        run: ./build/rho-boot test corpus --target wasm32-wasi
